<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Preview Not Found</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0b0f17;
      color: #e2e8f0;
    }
    .card {
      max-width: 460px;
      padding: 2rem;
      border: 1px solid #1e293b;
      border-radius: 12px;
      background: #111827;
      text-align: center;
    }
    h1 { margin: 0 0 0.5rem; font-size: 2rem; color: #38bdf8; }
    p { margin: 0; line-height: 1.5; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <p>This preview environment does not exist or has already been torn down.</p>
  </div>
</body>
</html>
